name: Build and Deploy Benchmark Results

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static files
        env:
          NODE_ENV: production
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm run build

      - name: Verify static artifact
        run: pnpm verify:site

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          path: site/build
          name: pages-production
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-pages.yml
    with:
      artifact-name: pages-production
