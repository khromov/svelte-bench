name: Test Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Type checks
        run: pnpm check && pnpm check:site

      - name: Renderer tests
        run: pnpm test:site

      - name: Test build
        env:
          NODE_ENV: production
          BASE_PATH: /svelte-bench
        run: pnpm run build

      - name: Verify static artifact
        run: pnpm verify:site
